<!DOCTYPE html>

<html class="h-full bg-background" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_stack" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "tertiary-container": "#1c1b1a", "outline": "#747878", "secondary": "#4d6700", "background": "#fbf9f9", "on-tertiary-fixed": "#1c1b1a", "on-surface-variant": "#444748", "surface-container-high": "#e9e8e7", "secondary-container": "#c8f169", "on-secondary": "#ffffff", "surface-variant": "#e3e2e2", "primary": "#000000", "on-surface": "#1b1c1c", "on-error": "#ffffff", "surface-container-low": "#f5f3f3", "on-tertiary-fixed-variant": "#484645", "outline-variant": "#c4c7c7", "error-container": "#ffdad6", "on-tertiary-container": "#868382", "surface-container": "#efeded", "secondary-fixed": "#c8f169", "surface-container-highest": "#e3e2e2", "on-secondary-fixed-variant": "#394d00", "surface": "#fbf9f9", "tertiary-fixed": "#e6e2df", "on-primary-fixed": "#1c1b1b", "secondary-fixed-dim": "#add450", "surface-container-lowest": "#ffffff", "surface-dim": "#dbdad9", "surface-tint": "#5f5e5e", "inverse-on-surface": "#f2f0f0", "on-error-container": "#93000a", "on-secondary-fixed": "#151f00", "tertiary-fixed-dim": "#cac6c4", "error": "#ba1a1a", "on-primary-container": "#858383", "on-primary-fixed-variant": "#474746", "surface-bright": "#fbf9f9", "primary-container": "#1c1b1b", "tertiary": "#000000", "on-primary": "#ffffff", "inverse-primary": "#c8c6c5", "primary-fixed": "#e5e2e1", "on-tertiary": "#ffffff", "inverse-surface": "#303031", "primary-fixed-dim": "#c8c6c5", "on-background": "#1b1c1c", "on-secondary-container": "#526d00" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "space-sm": "0.5rem", "gutter": "1rem", "space-md": "1rem", "space-xl": "2rem" }, fontFamily: { "headline-sm": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "headline-xl-mobile": ["Plus Jakarta Sans"], "label-caps": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "headline-xl": ["Plus Jakarta Sans"], "label-numeric": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"] }, fontSize: { "headline-sm": ["18px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" }], "headline-xl-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "800" }], "label-caps": ["11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "800" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400" }], "headline-lg": ["24px", { "lineHeight": "30px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-xl": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "800" }], "label-numeric": ["15px", { "lineHeight": "20px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.01em", "fontWeight": "500" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }

</head><body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Go Back" class="w-11 h-11 -ml-2 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-container transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><img alt="FitFinder Telkom Logo" class="h-7 w-auto object-contain shrink-0" src="https://lh3.googleusercontent.com/aida/AEtjO1Vuszryk42cAaxips6IEIhMo2N2UsOFKP8TWCyId3GJ63hkviXM_xZkRRlWBXMfSR7U71UsY0g_svDbJe1vQ0B5DpviNB4gjBHKmlnopXbrUdLVxuzc6OwLzRKwjwoZyeTuFPJJuRfm6YngNS0EaLwYB5Y74k9m9NQcagkBKRFWFNT5ETjadwmNxvY1ZBdge7uNf1vP0LP6ILx1v-csNbUb7D_p0fS5jI71Nne4venbEjfiOLl6FqVvbVCb"/><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Auth Sign In</h1></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 bg-background min-h-screen"><div class="flex flex-col w-full px-margin pb-safe">
<!-- Athletic Hero Banner / Campus Aesthetic Snapshot -->
<!-- Editorial Main Header -->
<div class="flex flex-col mb-space-md"><h2 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight font-bold">Find Your Fit.</h2><p class="font-body-md text-body-md text-on-surface-variant mt-1.5 leading-relaxed">Create an account to discover and manage gyms around Telkom University.</p></div>
<!-- Role Switcher Segmented Control -->
<div class="w-full bg-surface-container-high p-1 rounded-xl flex items-center mb-space-md" role="tablist"><button aria-selected="true" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-body-sm text-body-sm font-semibold transition-all duration-150 bg-primary text-on-primary shadow-sm" id="role-student" onclick="setRole('student')" role="tab" type="button"><span>Student</span></button><button aria-selected="false" class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-body-sm text-body-sm font-medium transition-all duration-150 text-on-surface-variant hover:text-on-surface" id="role-owner" onclick="setRole('owner')" role="tab" type="button"><span>Gym Owner</span></button></div>
<!-- Registration Form Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-space-md shadow-sm mb-space-md">
<form class="flex flex-col gap-space-md" id="register-form" onsubmit="event.preventDefault(); handleRegistration();"><div class="flex flex-col gap-1.5"><label class="font-body-sm text-body-sm font-semibold text-on-surface" for="full-name">Full Name</label><div class="relative flex items-center"><input class="w-full h-12 bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md rounded-lg px-space-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary transition-all border border-[#E5E5E0]" id="full-name" placeholder="e.g., Arya Pratama" required="" type="text"/><span class="material-symbols-outlined text-outline-variant absolute right-3 pointer-events-none text-[20px]">badge</span></div></div><div class="flex flex-col gap-1.5"><label class="font-body-sm text-body-sm font-semibold text-on-surface" for="email"><span id="email-label">Email</span></label><div class="relative flex items-center"><input class="w-full h-12 bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md rounded-lg px-space-md focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary transition-all border border-[#E5E5E0]" id="email" placeholder="name@example.com" required="" type="email"/><span class="material-symbols-outlined text-outline-variant absolute right-3 pointer-events-none text-[20px]">mail</span></div></div><div class="flex flex-col gap-1.5"><label class="font-body-sm text-body-sm font-semibold text-on-surface" for="password">Password</label><div class="relative flex items-center"><input class="w-full h-12 bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md rounded-lg px-space-md pr-11 focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary transition-all border border-[#E5E5E0]" id="password" placeholder="Min. 8 alphanumeric characters" required="" type="password"/><button aria-label="Toggle password visibility" class="absolute right-2.5 w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-on-surface" onclick="togglePasswordVisibility('password', this)" type="button"><span class="material-symbols-outlined text-[20px]">visibility</span></button></div></div><div class="flex flex-col gap-1.5"><label class="font-body-sm text-body-sm font-semibold text-on-surface" for="confirm-password">Confirm Password</label><div class="relative flex items-center"><input class="w-full h-12 bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/60 font-body-md text-body-md rounded-lg px-space-md pr-11 focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary transition-all border border-[#E5E5E0]" id="confirm-password" placeholder="Re-type your password" required="" type="password"/><button aria-label="Toggle confirm password visibility" class="absolute right-2.5 w-8 h-8 flex items-center justify-center text-on-surface-variant hover:text-on-surface" onclick="togglePasswordVisibility('confirm-password', this)" type="button"><span class="material-symbols-outlined text-[20px]">visibility</span></button></div></div><button class="w-full h-12 mt-space-xs bg-primary hover:bg-primary-container text-on-primary font-headline-sm text-headline-sm rounded-xl flex items-center justify-center gap-space-sm transition-transform active:scale-[0.99] shadow-sm" id="cta-submit" type="submit"><span>Create Account</span><span class="material-symbols-outlined text-[20px] text-secondary-container">arrow_forward</span></button><p class="font-body-sm text-body-sm text-center text-on-surface-variant px-space-xs leading-relaxed">By tapping "Create Account", you agree to FitFinder TLU's <a class="underline text-on-surface font-medium hover:text-primary" href="#">Terms of Service</a> and <a class="underline text-on-surface font-medium hover:text-primary" href="#">Privacy Policy</a>.</p></form>
</div>
<!-- Bottom Navigation Link -->
<div class="w-full flex items-center justify-center pb-space-lg"><div class="flex items-center gap-1.5 text-body-md font-body-md text-on-surface-variant"><span>Already have an account?</span><a class="text-on-surface font-bold underline decoration-secondary decoration-2 hover:text-primary transition-colors" href="#">Log in.</a></div></div>
</div>
<script>
  function togglePasswordVisibility(fieldId, triggerBtn) {
    const input = document.getElementById(fieldId);
    const icon = triggerBtn.querySelector('.material-symbols-outlined');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function setRole(role) {
    const btnStudent = document.getElementById('role-student');
    const btnOwner = document.getElementById('role-owner');
    const emailLabel = document.getElementById('email-label');
    const emailInput = document.getElementById('email');
    const emailHint = document.getElementById('email-hint');
    const badgeDomain = document.getElementById('badge-domain');
    const dormSelector = document.getElementById('dorm-selector');
    const ctaBtn = document.getElementById('cta-submit');

    if (role === 'student') {
      btnStudent.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-body-sm text-body-sm font-semibold transition-all duration-150 bg-primary text-on-primary shadow-sm";
      btnStudent.setAttribute('aria-selected', 'true');
      btnOwner.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-body-sm text-body-sm font-medium transition-all duration-150 text-on-surface-variant hover:text-on-surface";
      btnOwner.setAttribute('aria-selected', 'false');

      emailLabel.textContent = "Student Email";
      emailInput.placeholder = "name@student.telkomuniversity.ac.id";
      badgeDomain.textContent = "Instant Verification";
      badgeDomain.className = "text-secondary font-semibold font-body-sm text-[11px] bg-secondary-container/30 px-1.5 py-0.5 rounded";
      emailHint.innerHTML = '<span class="material-symbols-outlined text-[15px] text-secondary">check_circle</span><span>Use <strong>@student.telkomuniversity.ac.id</strong> to unlock student membership rates.</span>';
      dormSelector.classList.remove('hidden');
      ctaBtn.querySelector('span:first-child').textContent = "Create Student Account";
    } else {
      btnOwner.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-body-sm text-body-sm font-semibold transition-all duration-150 bg-primary text-on-primary shadow-sm";
      btnOwner.setAttribute('aria-selected', 'true');
      btnStudent.className = "flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-body-sm text-body-sm font-medium transition-all duration-150 text-on-surface-variant hover:text-on-surface";
      btnStudent.setAttribute('aria-selected', 'false');

      emailLabel.textContent = "Business Email";
      emailInput.placeholder = "owner@fitnessbandung.com";
      badgeDomain.textContent = "Facility Admin";
      badgeDomain.className = "text-on-surface-variant font-semibold font-body-sm text-[11px] bg-surface-container-high px-1.5 py-0.5 rounded";
      emailHint.innerHTML = '<span class="material-symbols-outlined text-[15px] text-outline">info</span><span>Register to manage slot schedules, equipment telemetry, and gym turnstiles.</span>';
      dormSelector.classList.add('hidden');
      ctaBtn.querySelector('span:first-child').textContent = "Register Partner Gym";
    }
  }

  function selectArea(activeButton) {
    const buttons = document.querySelectorAll('.area-btn');
    buttons.forEach(btn => {
      btn.className = "area-btn h-9 rounded-lg bg-surface-container-high text-on-surface text-center font-body-sm text-body-sm font-medium hover:bg-surface-variant transition-colors active:scale-95";
    });
    activeButton.className = "area-btn h-9 rounded-lg bg-primary text-on-primary text-center font-body-sm text-body-sm font-bold active:scale-95";
  }

  function handleRegistration() {
    const name = document.getElementById('full-name').value;
    const btn = document.getElementById('cta-submit');
    const originalText = btn.innerHTML;
    
    btn.disabled = true;
    btn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[20px] text-secondary-container">progress_activity</span><span>Verifying Tel-U ID...</span>`;
    
    setTimeout(() => {
      btn.innerHTML = `<span class="material-symbols-outlined text-[20px] text-secondary-container">check_circle</span><span>Welcome, ${name.split(' ')[0] || 'Athlete'}!</span>`;
      btn.classList.add('bg-secondary', 'text-on-secondary');
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
        btn.classList.remove('bg-secondary', 'text-on-secondary');
      }, 2000);
    }, 1200);
  }
</script></main></body></html>
