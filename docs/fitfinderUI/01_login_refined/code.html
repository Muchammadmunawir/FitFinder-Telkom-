</head><body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Go Back" class="w-11 h-11 -ml-2 flex items-center justify-center rounded-lg text-on-surface hover:bg-surface-container transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><img alt="FitFinder Telkom Logo" class="h-7 w-auto object-contain shrink-0" src="https://lh3.googleusercontent.com/aida/AEtjO1Vuszryk42cAaxips6IEIhMo2N2UsOFKP8TWCyId3GJ63hkviXM_xZkRRlWBXMfSR7U71UsY0g_svDbJe1vQ0B5DpviNB4gjBHKmlnopXbrUdLVxuzc6OwLzRKwjwoZyeTuFPJJuRfm6YngNS0EaLwYB5Y74k9m9NQcagkBKRFWFNT5ETjadwmNxvY1ZBdge7uNf1vP0LP6ILx1v-csNbUb7D_p0fS5jI71Nne4venbEjfiOLl6FqVvbVCb"/><h1 class="font-headline-sm text-headline-sm text-on-surface truncate">Auth Sign In</h1></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 bg-background min-h-screen"><div class="flex flex-col w-full px-margin pb-safe">
<!-- Subtle athletic watermark banner / top meta tag -->
<!-- Hero Brand & Editorial Header -->
<div class="mt-space-md mb-space-lg">
<div class="inline-flex items-center gap-space-sm mb-space-md">
<div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center p-2">
<svg class="w-6 h-6" fill="none" viewbox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
<rect fill="#C8F169" height="4" rx="2" width="22" x="3" y="5"></rect>
<rect fill="#C8F169" height="4" rx="2" width="16" x="3" y="12"></rect>
<rect fill="#C8F169" height="4" rx="2" width="10" x="3" y="19"></rect>
</svg>
</div>
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm tracking-tight text-on-surface uppercase">FITFINDER<span class="text-outline text-[11px] align-super font-bold ml-0.5">TLU</span></span>
<span class="font-body-sm text-body-sm text-outline -mt-1">Telkom University Gym Pass</span>
</div>
</div>
<h2 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface tracking-tight">
      Welcome Back.
    </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Sign in to access your FitFinder account.</p>
</div>
<!-- Role Selector Switcher -->
<div class="mb-space-lg p-1 bg-surface-container rounded-xl flex items-center justify-between">
<button class="flex-1 py-2 px-space-sm rounded-lg font-headline-sm text-body-md flex items-center justify-center gap-space-xs transition-all bg-primary text-on-primary" id="role-student" onclick="switchRole('student')" type="button">
<span class="material-symbols-outlined text-[18px]">school</span>
<span>Student Pass</span>
</button>
<button class="flex-1 py-2 px-space-sm rounded-lg font-body-md text-body-md flex items-center justify-center gap-space-xs transition-all text-on-surface-variant hover:text-on-surface" id="role-owner" onclick="switchRole('owner')" type="button">
<span class="material-symbols-outlined text-[18px]">storefront</span>
<span>Gym Owner</span>
</button>
</div>
<!-- Primary Form Card -->
<div class="bg-surface-container-lowest p-space-lg rounded-xl flex flex-col gap-space-md shadow-sm">
<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<label class="font-headline-sm text-body-sm text-on-surface" for="email">
          Institutional Email / NIM
        </label>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">
          alternate_email
        </span>
<input class="w-full h-12 pl-10 pr-4 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="email" placeholder="student@telkomuniversity.ac.id" type="email" value=""/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<label class="font-headline-sm text-body-sm text-on-surface" for="password">
          Password
        </label>
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors underline decoration-outline-variant" href="#forgot">
          Forgot password?
        </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">
          lock
        </span>
<input class="w-full h-12 pl-10 pr-12 bg-surface-container-low rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-lowest transition-colors" id="password" placeholder="••••••••••••" type="password" value=""/>
<button aria-label="Toggle password visibility" class="absolute right-2 w-9 h-9 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-colors" id="togglePasswordBtn" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Helper / SSO verification tag -->
<!-- Submit CTA Button -->
<button class="w-full h-12 rounded-lg bg-primary hover:bg-tertiary-container active:scale-[0.99] text-on-primary font-headline-sm text-body-lg flex items-center justify-center gap-space-sm transition-all shadow-sm mt-1" id="loginBtn" onclick="handleLogin()" type="button">
<span id="loginText">Log In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Quick Demo Credentials Pre-fill Bar -->
<!-- Surrounding District Affiliation -->
<!-- Bottom Registration Link -->
<div class="text-center pb-space-lg mt-auto">
<p class="font-body-md text-body-md text-on-surface-variant">Don't have an account? <a class="font-headline-sm text-body-md text-on-surface hover:text-secondary underline decoration-secondary ml-1 transition-colors" href="#register">Create one.</a></p>
</div>
</div>
<script>
  let currentRole = 'student';

  function switchRole(role) {
    currentRole = role;
    const studentBtn = document.getElementById('role-student');
    const ownerBtn = document.getElementById('role-owner');
    const roleBadge = document.getElementById('role-badge');
    const emailInput = document.getElementById('email');

    if (role === 'student') {
      studentBtn.className = "flex-1 py-2 px-space-sm rounded-lg font-headline-sm text-body-md flex items-center justify-center gap-space-xs transition-all bg-primary text-on-primary";
      ownerBtn.className = "flex-1 py-2 px-space-sm rounded-lg font-body-md text-body-md flex items-center justify-center gap-space-xs transition-all text-on-surface-variant hover:text-on-surface";
      roleBadge.textContent = "@student.telkomuniversity.ac.id";
      roleBadge.className = "font-label-caps text-label-caps text-secondary font-bold uppercase";
      if (!emailInput.value.includes('partner')) {
        emailInput.value = "fauzan.ramadhan@student.telkomuniversity.ac.id";
      }
    } else {
      ownerBtn.className = "flex-1 py-2 px-space-sm rounded-lg font-headline-sm text-body-md flex items-center justify-center gap-space-xs transition-all bg-primary text-on-primary";
      studentBtn.className = "flex-1 py-2 px-space-sm rounded-lg font-body-md text-body-md flex items-center justify-center gap-space-xs transition-all text-on-surface-variant hover:text-on-surface";
      roleBadge.textContent = "PARTNER / GYM DESK";
      roleBadge.className = "font-label-caps text-label-caps text-on-surface-variant font-bold uppercase";
      emailInput.value = "admin.sukabirus@fitfinder-partner.id";
    }
  }

  function togglePassword() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      eyeIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      eyeIcon.textContent = 'visibility';
    }
  }

  function fillDemo(type) {
    if (type === 'student') {
      switchRole('student');
      document.getElementById('email').value = '1301213088@student.telkomuniversity.ac.id';
      document.getElementById('password').value = 'studentPass2025!';
    } else {
      switchRole('owner');
      document.getElementById('email').value = 'manager@sukabirus-fitness.id';
      document.getElementById('password').value = 'ownerDeskAccess2025';
    }
  }

  function handleLogin() {
    const btn = document.getElementById('loginBtn');
    const text = document.getElementById('loginText');
    const originalText = text.textContent;

    btn.disabled = true;
    text.textContent = 'Authenticating SSO...';
    btn.classList.add('opacity-80');

    setTimeout(() => {
      text.textContent = 'Pass Verified ✓';
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed');
      setTimeout(() => {
        text.textContent = originalText;
        btn.classList.remove('bg-secondary-fixed', 'text-on-secondary-fixed');
        btn.classList.add('bg-primary');
        btn.disabled = false;
      }, 1500);
    }, 700);
  }
</script></main></body></html>
